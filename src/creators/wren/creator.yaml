    alt: "Two overlapping soft-edged circles, magenta over violet, on a pale pink ground."
    title: "Held Breath"
    year: "2026"
    medium: "gouache on paper"
  - image_url: "assets/artwork-2.svg"
    alt: "A jagged magenta mountain range silhouette against a near-black sky."
    title: "Night Line"
    year: "2026"
    medium: "ink"
  - image_url: "assets/artwork-3.svg"
    alt: "An open magenta rectangle frame with a single diagonal line crossing it, on cream paper."
    title: "Crossing"
    medium: "ink and gouache"

