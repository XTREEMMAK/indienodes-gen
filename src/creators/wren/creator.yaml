id: art-wren
creator: Wren
type: art # audio | comic | text | game | art

why: "Ink and gouache studies of things that don't hold still."
bio: |
  Wren paints from memory rather than reference, working fast in gouache
  and ink so the image is finished before the memory sharpens back into
  something accurate. Most pieces take under an hour.
tags: [ink, gouache, studies]

# <= 3, enforced in the works/art.njk partial. alt is mandatory per the
# ring schema — it's not treated as optional metadata here either.
artworks:
