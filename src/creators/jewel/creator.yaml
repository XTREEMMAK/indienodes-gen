# Field names follow the indienodes-ring schema by convention (creator,
# type, why, tags, tracks[].label/media_url, source_url) — there is no
# schema coupling in v1, no validation against the ring, and no derived
# ring-entry emission. See the project plan's "Deliberately not in v1".
#
# `id` is the ring entry id this creator would use if/when they join —
# it's what makes the widget's Prev/Next/Random resolve to their actual
# ring neighbours. Leave it unset for a creator with no ring entry yet.
id: audio-jewel
creator: Jewel
type: audio # audio | comic | text | game | art

why: "Bedroom pop, recorded badly on purpose." # <= 75 chars, per the ring schema
bio: |
  Jewel writes and records everything alone in one room, on whatever's
  closest — a phone mic more often than not. The songs are short, a little
  unfinished on purpose, and meant to sound like they were made by a person
  rather than polished by one.
tags: [pop, lo-fi, bedroom]

# <= 3, enforced in the works/audio.njk partial regardless of how many are
# listed here.
tracks:
  - label: "Should I Stay"
    media_url: "assets/track-1.wav"
  - label: "Weight of the Other Promise"
    media_url: "assets/track-2.wav"
  - label: "Angel's Burning Blue Savior"
    media_url: "assets/track-3.wav"

thumb_url: "assets/profile.svg"
source_url: "https://jewel.example.com" # their primary site — rendered first in links

links:
  - label: Bandcamp
    url: "https://bandcamp.com"
  - label: Instagram
    url: "https://instagram.com"

theme:
  skin: card
  accent: "#d7a9bc"
  backgroundImage: "assets/background.svg"

sections:
  about: true
  works: true
  links: true

ring:
  verificationToken: "sample-verification-token"
  tier: widget # widget | widget-script | badge | text-link
  badgeStyle: classic # classic | minimal | type-coded | mono
